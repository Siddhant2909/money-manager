<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Create account · Money Manager</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script src="/js/common.js" defer></script>
<script src="/js/register.js" defer></script>
</head>
<body>
<main>
  <section class="center">
    <div class="authcard">
      <img class="logo lg" src="/favicon.svg" alt="" width="44" height="44">
      <h1>Create your account</h1>
      <p class="muted">Track every rupee in one calm place. You'll add your bank accounts and cards next.</p>
      <div id="googleWrap" class="hidden">
        <a class="btn google block" href="/auth/google?from=register"><svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg><span>Sign up with Google</span></a>
        <div class="or"><span>or use your email</span></div>
      </div>
      <form id="regForm" class="stack" novalidate>
        <div><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="60" required placeholder="e.g. Priya Sharma"></div>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="254" required></div>
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          <div class="hint">At least 10 characters. A short phrase works well, e.g. "teal lamp river 42".</div></div>
        <div><label for="password2">Confirm password</label><input id="password2" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
        <div class="err" id="regErr" role="alert"></div>
        <button class="btn primary block" id="regBtn" type="submit">Create account</button>
        <p class="auth-foot">Already registered? <a href="/">Sign in</a></p>
      </form>
    </div>
  </section>
</main>
</body>
</html>
